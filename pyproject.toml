[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fleetmon"
version = "0.1.0"
description = "A live, multi-device view of the agents and inference servers on a fleet."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Soura" }]
keywords = ["dashboard", "monitoring", "agents", "llm", "tui", "fleet"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console :: Curses",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: System :: Monitoring",
  "Topic :: System :: Systems Administration",
]

# No runtime dependencies, deliberately. A monitoring tool that needs a working
# package resolver on the machine it is supposed to be watching is a tool that
# fails exactly when you need it. psutil is used when present and has working
# stdlib fallbacks when it is not.
dependencies = []

[project.optional-dependencies]
fast = ["psutil>=5.9"]

[project.scripts]
fleetmon = "fleetmon.cli:main"

[project.urls]
Homepage = "https://github.com/soura/fleetmon"
Issues = "https://github.com/soura/fleetmon/issues"

[tool.setuptools.packages.find]
include = ["fleetmon*"]

[tool.setuptools.package-data]
fleetmon = ["py.typed"]
